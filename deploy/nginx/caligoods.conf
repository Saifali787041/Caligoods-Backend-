# /etc/nginx/sites-available/caligoods.conf
# Reverse proxy for the Caligoods API + static SPA hosting, terminating TLS.

upstream caligoods_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ---- HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name caligoodsinc.com www.caligoodsinc.com;

    # Allow ACME HTTP-01 challenges (certbot) before the redirect.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name caligoodsinc.com www.caligoodsinc.com;

    # Certs managed by certbot (see DEPLOYMENT.md)
    ssl_certificate     /etc/letsencrypt/live/caligoodsinc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caligoodsinc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (app also sets Helmet headers; these are the edge baseline)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12m;   # room for image uploads (Phase: image upload)
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # ---- API + Swagger -> Node ----
    location ~ ^/(api|api-docs) {
        proxy_pass http://caligoods_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # feeds Express 'trust proxy'
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ---- Frontend SPA (build output). Placeholder until the React app is built. ----
    root /var/www/caligoods/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # SPA history-mode fallback
    }
}
